spring.application.name=ishtirak-test

# Tests run against a REAL PostgreSQL database (separate from the development one), never an in-memory DB.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ishtirak_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

ishtirak.token.secret=test-secret
ishtirak.token.ttl-hours=1
