spring.application.name=ishtirak

# PostgreSQL connection (override with DB_URL / DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ishtirak_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (CHECK constraints and the partial unique index cannot be generated by Hibernate).
# db/seed adds demo data on top of the schema; tests use db/migration only.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Hibernate only checks that the entities match the Flyway schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# Login tokens (HMAC-signed). Change the secret outside development.
ishtirak.token.secret=${TOKEN_SECRET:dev-only-secret-change-me-ishtirak-2026}
ishtirak.token.ttl-hours=12
